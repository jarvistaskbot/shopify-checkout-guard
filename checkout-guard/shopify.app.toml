# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4e9e166367e80c062d31c73303a085bc"
name = "CheckoutGuard"
application_url = "https://checkoutguardalerts.com"
embedded = false

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

  # v2 inventory tracking REMOVED for App Store submission (2026-09-15): requesting
  # scopes/webhooks the reviewed app does not visibly use is a standard rejection
  # reason. Re-add after approval:
  #   [[webhooks.subscriptions]]
  #   uri = "/webhooks/inventory/update"
  #   topics = [ "inventory_levels/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# v1 submission scopes only. v2 re-adds read_inventory + read_products AFTER approval.
# write_pixels + read_customer_events are both required for webPixelCreate —
# without them the pixel extension never activates and checkout_started events
# never arrive (Shopify: "requires read_customer_events access scope").
scopes = "read_checkouts,read_orders,write_pixels,read_customer_events"

[auth]
redirect_urls = [ "https://checkoutguardalerts.com/auth/callback" ]
